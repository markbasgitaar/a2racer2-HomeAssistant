server {
    listen 8099;
    server_name _;
    root /usr/share/nginx/html;
    index a2racer2.html;
    charset utf-8;
# Home Assistant ingress serves the add-on below a path prefix. Relative
# redirects and the page's relative script URLs keep working that way.
    absolute_redirect off;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/wasm application/json image/svg+xml;
    add_header X-Content-Type-Options "nosniff" always;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /favicon.ico {
        access_log off;
        return 204;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(?:js|wasm)$ {
        add_header X-Content-Type-Options "nosniff" always;
# No long-lived immutable caching: an add-on update must not leave an
# old loader or WASM binary behind in the browser.
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /a2racer2.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
# The game data itself. config.yaml maps /share read-only; players put their
# own A2 Racer II files in /share/a2racer2. The JSON file list lets the page
# find RCS.IMG without hard-coding file names, and no-cache makes a changed
# share visible on the next page load.
    location ^~ /game/ {
        alias /share/a2racer2/;
        autoindex on;
        autoindex_format json;
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache";
    }
}
